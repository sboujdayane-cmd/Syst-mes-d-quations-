<div class="card" id="studentIdentification" style="color:var(--text);margin:18px 0">
  <h2>👤 Mon profil</h2>

  <div class="form-row">
    <label for="studentFirstName">
      Prénom
      <input
        type="text"
        id="studentFirstName"
        autocomplete="given-name"
        placeholder="Ex. Sarah">
    </label>

    <label for="studentLastName">
      Nom
      <input
        type="text"
        id="studentLastName"
        autocomplete="family-name"
        placeholder="Ex. Dupont">
    </label>
  </div>

  <div class="actions">
    <button class="btn success" id="saveStudentName">
      Enregistrer mon nom
    </button>

    <button class="btn ghost" id="changeStudent">
      Changer d’élève
    </button>
  </div>

  <div id="studentWelcome" class="feedback"></div>
</div>
